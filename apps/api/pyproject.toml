[tool.ruff]
target-version = "py311"
line-length = 100
# B008 is FastAPI's standard Depends() idiom (documented false positive).
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests use obviously-fake credential-shaped values; real secrets are banned
# from the repo by CONTRIBUTING.md and scanned in CI-adjacent checks.
"tests/**" = ["S101", "S105", "S307", "S301", "S602"]
"alembic/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# TesterInput is a Pydantic schema, not a test class.
filterwarnings = ["ignore:.*test class 'TesterInput'.*:pytest.PytestCollectionWarning"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["nexus"]

[tool.coverage.report]
show_missing = true
skip_covered = false
