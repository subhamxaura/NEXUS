name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: apps/api
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: apps/api
        run: ruff check . && ruff format --check .
      - name: Types
        working-directory: apps/api
        run: mypy nexus
      - name: Tests
        working-directory: apps/api
        run: pytest -q --cov --cov-report=term --cov-fail-under=80
      - name: Shared types drift
        working-directory: apps/api
        run: |
          PYTHONPATH=. python scripts/gen_types.py
          git diff --exit-code -- ../../packages/shared-types/index.d.ts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run lint && npm run typecheck && npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose config

      - name: Test infrastructure
        run: docker compose up -d db redis && sleep 10 && docker compose down -v

      - name: Cleanup CI environment
        if: always()
        run: rm -f .env
